<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F6F5E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zuhause">
<title>Zuhause – Family Organizer</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.109.0/dist/umd/supabase.js"></script>
<style>
:root{--bg:#EEF3EC;--card:#fff;--ink:#23332E;--mute:#6B7B74;--line:#DDE5DD;--brand:#2F6F5E;--soft:#DCEBE4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141B18;--card:#1E2824;--ink:#E8EFEA;--mute:#9BAAA2;--line:#2C3A34;--brand:#5FB89C;--soft:#25362F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141B18;--card:#1E2824;--ink:#E8EFEA;--mute:#9BAAA2;--line:#2C3A34;--brand:#5FB89C;--soft:#25362F;color-scheme:dark}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px}
.inp{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 12px;color:var(--ink);font:inherit;min-width:0;width:100%}
.inp:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.ghost{background:transparent;border:0;border-bottom:1px dashed var(--line);border-radius:0;padding:4px 2px}
.btn{background:var(--brand);color:#fff;border-radius:12px;padding:8px 14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
:root[data-theme="dark"] .btn{color:#10201a}
.mute{color:var(--mute)}
.chip{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;background:var(--card)}
.scroll{overflow-x:auto}
</style>
</head>
<body>
<div id="root"></div>
<script>
const {useState,useEffect}=React;const h=htm.bind(React.createElement);
const P=[{id:'me',n:'Me',c:'#E0566B'},{id:'partner',n:'Partner',c:'#3D8FD1'},{id:'c1',n:'Child 1',c:'#E9A21B'},{id:'c2',n:'Child 2',c:'#5BAA6B'}];
const pc=id=>P.find(p=>p.id===id)||P[0];
const pad=n=>String(n).padStart(2,'0');const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const NOW=new Date();const T0=new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate());const TODAY=iso(T0);
const addDays=n=>{const d=new Date(T0);d.setDate(d.getDate()+n);return iso(d)};
const parts=s=>s.split('-').map(Number);
const daysTo=s=>{const[,m,d]=parts(s);let n=new Date(T0.getFullYear(),m-1,d);if(n<T0)n=new Date(T0.getFullYear()+1,m-1,d);return Math.round((n-T0)/864e5)};
const ago=s=>{const[y,m,d]=parts(s);return Math.round((T0-new Date(y,m-1,d))/864e5)};
const uid=()=>Math.random().toString(36).slice(2,9);
// ===== SUPABASE: hier deine Werte eintragen (siehe Anleitung) =====
const SB_URL='https://wxljqaeqgqryvqeuqboa.supabase.co',SB_KEY='sb_publishable__uaRFyWcbF3-wQqCqqMssg_6bTyuVtk';
// ==================================================================
const sb=(SB_URL&&SB_KEY&&window.supabase)?window.supabase.createClient(SB_URL,SB_KEY):null;
const store={},subs={},timers={},LOCAL=['fo-priv'];
const emit=k=>(subs[k]||[]).forEach(f=>f(store[k]));
const save=k=>{clearTimeout(timers[k]);timers[k]=setTimeout(()=>{sb.from('family_data').upsert({key:k,value:store[k],updated_at:new Date().toISOString()}).then(r=>{if(r.error)console.error(r.error)})},400)};
function useLS(k,init){
  const loc=!sb||LOCAL.includes(k);
  const[v,setV]=useState(()=>{if(loc){try{const r=localStorage.getItem(k);return r?JSON.parse(r):init}catch(e){return init}}return k in store?store[k]:init});
  useEffect(()=>{
    if(loc){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}return}
    if(!(k in store)){store[k]=init;save(k)}
    const f=x=>setV(x);(subs[k]=subs[k]||[]).push(f);return()=>{subs[k]=subs[k].filter(g=>g!==f)}
  },[k,loc?v:0]);
  const set=loc?setV:x=>{const n=typeof x==='function'?x(store[k]):x;store[k]=n;emit(k);save(k)};
  return[v,set]}
const upd=(set,id,p)=>set(a=>a.map(x=>x.id===id?{...x,...p}:x));const del=(set,id)=>set(a=>a.filter(x=>x.id!==id));
const IC={cal:'M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z',cart:'M2 3h3l2.7 12.4a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 7H6M9 21h.01M18 21h.01',todo:'M9 11l3 3 8-8M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9',check:'M20 6 9 17l-5-5',plus:'M12 5v14M5 12h14',trash:'M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6',cake:'M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8M4 16s1.5-1 4-1 3.5 2 6 2 4-1 6-1M2 21h20M7 7v3M12 7v3M17 7v3',gift:'M20 12v10H4V12M2 7h20v5H2zM12 22V7M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z',eye:'M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z',eyeoff:'M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4M6.6 6.6A17 17 0 0 0 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6',left:'m15 18-6-6 6-6',right:'m9 18 6-6-6-6',home:'M3 11l9-8 9 8M5 10v10h14V10',box:'M21 8l-9-5-9 5v8l9 5 9-5zM3 8l9 5 9-5M12 13v8',lock:'M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4',link:'M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1',refresh:'M21 12a9 9 0 0 1-15.5 6.3L3 16M3 12A9 9 0 0 1 18.5 5.7L21 8M21 3v5h-5M3 21v-5h5',edit:'M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z',coin:'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM12 6v12M15 9h-4.5a2 2 0 0 0 0 4h3a2 2 0 0 1 0 4H9',shield:'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z',suit:'M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M4 7h16v13H4zM4 12h16',phone:'M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z',bell:'M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0'};
const Ic=(n,s=18)=>h`<svg width=${s} height=${s} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d=${IC[n]}/></svg>`;
const Dot=({id,s=10})=>h`<span style=${{background:pc(id).c,width:s,height:s,borderRadius:99,display:'inline-block',flex:'none'}}/>`;
const Del=({on})=>h`<button onClick=${on} aria-label="Delete" class="mute hover:text-red-500 p-1">${Ic('trash',16)}</button>`;
const Head=({ic,t,sub,col})=>h`<div class="flex items-center gap-3 mb-4"><span class="grid place-items-center w-10 h-10 rounded-2xl text-white" style=${{background:col}}>${Ic(ic,20)}</span><div><h2 class="text-xl font-extrabold leading-tight">${t}</h2>${sub&&h`<p class="text-sm mute">${sub}</p>`}</div></div>`;
const PSel=({v,on})=>h`<select class="inp" style=${{width:'auto'}} value=${v} onChange=${e=>on(e.target.value)}>${P.map(p=>h`<option key=${p.id} value=${p.id}>${p.n}</option>`)}</select>`;
const enter=fn=>e=>{if(e.key==='Enter')fn()};

const hit=(e,k)=>e.rep&&e.rep.length?k>=e.d&&e.rep.includes((new Date(...parts(k).map((v,i)=>i===1?v-1:v)).getDay()+6)%7):e.d===k;
const WD=['Mo','Tu','We','Th','Fr','Sa','Su'];
function Cal(){
  const[ev,setEv]=useLS('fo-ev',[{id:uid(),t:'Kita pickup',p:'c1',d:TODAY,tm:'16:00'},{id:uid(),t:'Dentist',p:'me',d:addDays(1),tm:'09:30'},{id:uid(),t:'Football practice',p:'c2',d:addDays(2),tm:'17:00'},{id:uid(),t:'Date night',p:'partner',d:addDays(3),tm:'19:30'},{id:uid(),t:'Family brunch',p:'me',d:addDays(5),tm:'10:30'}]);
  const[ym,setYm]=useState([NOW.getFullYear(),NOW.getMonth()]);const[sel,setSel]=useState(TODAY);const[f,setF]=useState('all');
  const[t,setT]=useState('');const[p,setP]=useState('me');const[tm,setTm]=useState('');const[te,setTe]=useState('');const[pl,setPl]=useState('');const[rep,setRep]=useState([]);const[nt,setNt]=useState('');
  const[y,m]=ym;const off=(new Date(y,m,1).getDay()+6)%7;const n=new Date(y,m+1,0).getDate();
  const cells=[...Array(off).fill(null),...Array.from({length:n},(_,i)=>i+1)];
  const vis=ev.filter(e=>f==='all'||e.p===f);
  const day=vis.filter(e=>hit(e,sel)).sort((a,b)=>(a.tm||'').localeCompare(b.tm||''));
  const go=k=>{const d=new Date(y,m+k,1);setYm([d.getFullYear(),d.getMonth()])};
  const add=()=>{if(!t.trim())return;const base={t:t.trim(),p,tm,te:tm?te:'',pl:pl.trim(),nt:nt.trim()};const[sy,sm,sd]=parts(sel);const dow=(new Date(sy,sm-1,sd).getDay()+6)%7;const dates=[...new Set([sel,...rep.map(i=>iso(new Date(sy,sm-1,sd-dow+i)))])];setEv(a=>[...a,...dates.map(d=>({id:uid(),d,...base}))]);setT('');setTm('');setTe('');setPl('');setNt('');setRep([])};
  return h`<section class="card p-5"><${Head} ic="cal" t="Family calendar" sub="Tap a day to see or add plans" col="#3D8FD1"/>
  <div class="flex flex-wrap gap-2 mb-4"><button class="chip" style=${f==='all'?{background:'var(--brand)',color:'#fff',borderColor:'var(--brand)'}:{}} onClick=${()=>setF('all')}>Everyone</button>
  ${P.map(q=>h`<button key=${q.id} class="chip flex items-center gap-2" style=${f===q.id?{background:q.c,color:'#fff',borderColor:q.c}:{}} onClick=${()=>setF(q.id)}>${f!==q.id&&h`<${Dot} id=${q.id} s=${8}/>`}${q.n}</button>`)}</div>
  <div class="flex items-center justify-between mb-2"><button class="p-2" aria-label="Previous month" onClick=${()=>go(-1)}>${Ic('left')}</button><b class="text-lg">${new Date(y,m,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</b><button class="p-2" aria-label="Next month" onClick=${()=>go(1)}>${Ic('right')}</button></div>
  <div class="grid grid-cols-7 gap-1 text-center text-xs mute mb-1">${['Mo','Tu','We','Th','Fr','Sa','Su'].map(d=>h`<div key=${d}>${d}</div>`)}</div>
  <div class="grid grid-cols-7 gap-1">${cells.map((d,i)=>{if(!d)return h`<div key=${'x'+i}/>`;const k=`${y}-${pad(m+1)}-${pad(d)}`;const es=vis.filter(e=>hit(e,k));const on=k===sel;
    return h`<button key=${k} onClick=${()=>setSel(k)} class="rounded-xl py-1.5 flex flex-col items-center gap-1 min-h-[52px]" style=${{background:on?'var(--brand)':k===TODAY?'var(--soft)':'transparent',color:on?'#fff':'inherit',fontWeight:k===TODAY?800:500}}><span class="text-sm">${d}</span><span class="flex gap-0.5 h-2">${es.slice(0,4).map(e=>h`<${Dot} key=${e.id} id=${e.p} s=${6}/>`)}</span></button>`})}</div>
  <div class="mt-4 pt-4" style=${{borderTop:'1px solid var(--line)'}}><p class="font-bold mb-2">${new Date(...parts(sel).map((x,i)=>i===1?x-1:x)).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}</p>
  ${day.length===0&&h`<p class="text-sm mute mb-2">Nothing planned. Add the first thing below.</p>`}
  ${day.map(e=>h`<div key=${e.id} class="flex items-center gap-3 py-1.5"><${Dot} id=${e.p} s=${12}/><span class="text-sm mute flex-none" style=${{width:92}}>${e.tm?(e.te?e.tm+'–'+e.te:e.tm):'all day'}</span><span class="flex-1 min-w-0"><b class="block">${e.t}</b>${e.pl&&h`<span class="text-xs mute block">📍 ${e.pl}</span>`}${e.nt&&h`<span class="text-xs mute block">📝 ${e.nt}</span>`}</span><span class="text-xs mute">${pc(e.p).n}</span><${Del} on=${()=>del(setEv,e.id)}/></div>`)}
  <div class="flex flex-wrap gap-2 mt-3"><input class="inp" style=${{flex:'1 1 150px'}} placeholder="New event" value=${t} onInput=${e=>setT(e.target.value)} onKeyDown=${enter(add)}/><input type="time" class="inp" style=${{width:108}} aria-label="Start time" value=${tm} onChange=${e=>setTm(e.target.value)}/><span class="mute">to</span><input type="time" class="inp" style=${{width:108}} aria-label="End time (optional)" value=${te} onChange=${e=>setTe(e.target.value)}/><${PSel} v=${p} on=${setP}/><button class="btn" onClick=${add}>${Ic('plus',16)}Add</button></div><input class="inp mt-2" placeholder="Place (optional), e.g. Office, Musterstr. 5" value=${pl} onInput=${e=>setPl(e.target.value)} aria-label="Place"/><input class="inp mt-2" placeholder="Note (optional), e.g. take ID" value=${nt} onInput=${e=>setNt(e.target.value)} aria-label="Note"/><div class="flex flex-wrap items-center gap-1.5 mt-2"><span class="text-sm mute">Also add to this week:</span>${WD.map((w,i)=>h`<button key=${w} class="chip" aria-pressed=${rep.includes(i)} style=${rep.includes(i)?{background:pc(p).c,color:'#fff',borderColor:pc(p).c}:{}} onClick=${()=>setRep(r=>r.includes(i)?r.filter(z=>z!==i):[...r,i])}>${w}</button>`)}</div>${rep.length>0&&h`<p class="text-xs mute mt-1">Adds a separate copy to each chosen day of this week only, so you can change single days later.</p>`}</div></section>`;
}

function Grocery({g,setG}){
  const[t,setT]=useState('');
  const add=()=>{if(!t.trim())return;setG(a=>[{id:uid(),t:t.trim(),done:false},...a]);setT('')};
  const left=g.filter(x=>!x.done).length;
  return h`<section class="card p-5"><${Head} ic="cart" t="Grocery list" sub=${left+' left to buy'} col="#5BAA6B"/>
  <div class="flex gap-2 mb-3"><input class="inp" placeholder="Add item" value=${t} onInput=${e=>setT(e.target.value)} onKeyDown=${enter(add)}/><button class="btn" onClick=${add} aria-label="Add item">${Ic('plus',16)}</button></div>
  ${g.length===0&&h`<p class="text-sm mute">List is empty. Add what you need.</p>`}
  ${[...g].sort((a,b)=>a.done-b.done).map(x=>h`<div key=${x.id} class="flex items-center gap-3 py-1.5"><button onClick=${()=>upd(setG,x.id,{done:!x.done})} aria-label="Toggle" class="grid place-items-center w-6 h-6 rounded-lg" style=${{border:'2px solid var(--brand)',background:x.done?'var(--brand)':'transparent',color:'#fff'}}>${x.done&&Ic('check',14)}</button><span class="flex-1" style=${{textDecoration:x.done?'line-through':'none',opacity:x.done?.5:1}}>${x.t}</span><${Del} on=${()=>del(setG,x.id)}/></div>`)}
  ${g.some(x=>x.done)&&h`<button class="text-sm mute mt-2 underline" onClick=${()=>setG(a=>a.filter(x=>!x.done))}>Clear bought items</button>`}</section>`;
}

function ChoresOld(){
  const[c,setC]=useLS('fo-chores',[{id:uid(),t:'Take out recycling',p:'partner',done:false},{id:uid(),t:'Pack swim bag',p:'c1',done:false},{id:uid(),t:'Tidy the Lego corner',p:'c2',done:true},{id:uid(),t:'Book pediatrician',p:'me',done:false}]);
  const[t,setT]=useState('');const[p,setP]=useState('me');
  const add=()=>{if(!t.trim())return;setC(a=>[...a,{id:uid(),t:t.trim(),p,done:false}]);setT('')};
  return h`<section class="card p-5"><${Head} ic="todo" t="Chores & to-dos" sub="Who does what this week" col="#E0566B"/>
  <div class="grid grid-cols-2 gap-2 mb-4">${P.map(q=>{const l=c.filter(x=>x.p===q.id);const d=l.filter(x=>x.done).length;return h`<div key=${q.id} class="rounded-xl p-2" style=${{background:'var(--bg)'}}><div class="flex justify-between text-xs font-bold"><span>${q.n}</span><span class="mute">${d}/${l.length}</span></div><div class="h-2 rounded-full mt-1.5" style=${{background:'var(--line)'}}><div class="h-2 rounded-full" style=${{width:(l.length?d/l.length*100:0)+'%',background:q.c,transition:'width .3s'}}/></div></div>`})}</div>
  <div class="flex gap-2 mb-3"><input class="inp" placeholder="New to-do" value=${t} onInput=${e=>setT(e.target.value)} onKeyDown=${enter(add)}/><${PSel} v=${p} on=${setP}/><button class="btn" onClick=${add} aria-label="Add to-do">${Ic('plus',16)}</button></div>
  ${[...c].sort((a,b)=>a.done-b.done).map(x=>h`<div key=${x.id} class="flex items-center gap-3 py-1.5"><button onClick=${()=>upd(setC,x.id,{done:!x.done})} aria-label="Toggle" class="grid place-items-center w-6 h-6 rounded-full" style=${{border:'2px solid '+pc(x.p).c,background:x.done?pc(x.p).c:'transparent',color:'#fff'}}>${x.done&&Ic('check',14)}</button><span class="flex-1" style=${{textDecoration:x.done?'line-through':'none',opacity:x.done?.5:1}}>${x.t}</span><button class="chip flex items-center gap-1.5" onClick=${()=>upd(setC,x.id,{p:P[(P.findIndex(q=>q.id===x.p)+1)%4].id})} title="Tap to reassign"><${Dot} id=${x.p} s=${8}/>${pc(x.p).n}</button><${Del} on=${()=>del(setC,x.id)}/></div>`)}</section>`;
}

const YN=({label,v,on})=>h`<button onClick=${on} class="chip flex items-center gap-1.5" style=${v?{background:'#5BAA6B',color:'#fff',borderColor:'#5BAA6B'}:{}}>${v&&Ic('check',13)}${label}: ${v?'Yes':'No'}</button>`;

function Birthdays(){
  const[b,setB]=useLS('fo-bd',[{id:uid(),n:'Emma (Kita friend)',d:'2020-11-22',inv:true,gift:false,thx:false},{id:uid(),n:'Oma Hannelore',d:'1955-12-03',inv:true,gift:true,thx:false},{id:uid(),n:'Leon (cousin)',d:'2019-12-18',inv:false,gift:false,thx:false},{id:uid(),n:'Onkel Markus',d:'1982-01-09',inv:false,gift:false,thx:false}]);
  const[n,setN]=useState('');const[d,setD]=useState('');
  const add=()=>{if(!n.trim()||!d)return;setB(a=>[...a,{id:uid(),n:n.trim(),d,inv:false,gift:false,thx:false}]);setN('');setD('')};
  const L=[...b].sort((x,y)=>daysTo(x.d)-daysTo(y.d));
  return h`<section class="card p-5"><${Head} ic="cake" t="Birthdays" sub="Invitations, party details & gifts" col="#E9A21B"/>
  <div class="flex flex-wrap gap-2 mb-4"><input class="inp" style=${{flex:'1 1 150px'}} placeholder="Name" value=${n} onInput=${e=>setN(e.target.value)} onKeyDown=${enter(add)}/><input type="date" class="inp" style=${{width:150}} value=${d} onChange=${e=>setD(e.target.value)}/><button class="btn" onClick=${add}>${Ic('plus',16)}Add</button></div>
  ${L.length===0&&h`<p class="text-sm mute">No birthdays yet. Add one above.</p>`}
  ${L.map(x=>{const k=daysTo(x.d);const age=new Date(T0.getTime()+k*864e5).getFullYear()-parts(x.d)[0];const done=x.inv&&x.gift;
    return h`<div key=${x.id} class="rounded-2xl p-3 mb-3" style=${{background:'var(--bg)',border:k<=14&&!done?'2px solid #E9A21B':'1px solid var(--line)'}}>
    <div class="flex items-center gap-3"><div class="text-center w-14 flex-none"><div class="text-2xl font-extrabold leading-none">${k===0?'Today':k}</div><div class="text-xs mute">${k===0?'🎉':k===1?'day':'days'}</div></div>
    <div class="flex-1 min-w-0"><div class="font-bold truncate">${x.n}</div><div class="text-sm mute">${new Date(...parts(x.d).map((v,i)=>i===1?v-1:v)).toLocaleDateString('en-GB',{day:'numeric',month:'long'})}${age>0&&age<120?' · turns '+age:''}</div></div><${Del} on=${()=>del(setB,x.id)}/></div>

  <header class="pt-6 pb-4 flex flex-wrap items-end justify-between gap-3"><div><h1 class="text-4xl font-extrabold tracking-tight" style=${{color:'var(--brand)'}}>Zuhause</h1><p class="mute">${NOW.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}</p></div><div class="flex gap-3">${P.map(p=>h`<span key=${p.id} class="flex items-center gap-1.5 text-sm font-semibold"><${Dot} id=${p.id}/>${p.n}</span>`)}<button class="chip flex items-center gap-1.5" onClick=${()=>setOpen(!open)}>${Ic('edit',14)}Names & colors</button><button class="chip flex items-center gap-1.5" onClick=${()=>setRo(!ro)}>${Ic('bell',14)}Reminders${due.length>0?' ('+due.length+')':''}</button></div></header>
  ${bdToday.length>0&&h`<div role="dialog" aria-modal="true" style=${{position:'fixed',inset:0,zIndex:50,background:'rgba(0,0,0,.5)',display:'grid',placeItems:'center',padding:16}}><div class="card p-6 text-center" style=${{maxWidth:380,width:'100%',border:'2px solid #E9A21B'}}><div style=${{fontSize:52}}>🎉</div><h2 class="text-2xl font-extrabold mb-2">Birthday today!</h2>${bdToday.map(b=>{const a=T0.getFullYear()-parts(b.d)[0];return h`<p key=${b.id} class="text-lg font-semibold">Today is ${b.n}’s birthday${a>0&&a<120?' (turns '+a+')':''}</p>`})}<p class="text-sm mute mt-2">Time to call or send a message.</p><button class="btn mt-4" onClick=${()=>setBdToday([])}>Got it</button></div></div>`}
  ${ro&&h`<div class="card p-4 mb-4"><p class="font-bold mb-3">Reminders</p><div class="flex flex-wrap gap-2"><input class="inp" style=${{flex:'1 1 160px'}} placeholder="Remind me to..." value=${rt} onInput=${e=>setRt(e.target.value)} onKeyDown=${enter(addRem)}/><input type="date" class="inp" style=${{width:150}} value=${rd} onChange=${e=>setRd(e.target.value)}/><input type="time" class="inp" style=${{width:108}} aria-label="Time (optional)" value=${rtm} onChange=${e=>setRtm(e.target.value)}/><button class="btn" onClick=${addRem}>${Ic('plus',16)}Add</button></div>
  <div class="mt-3">${rem.length===0&&h`<p class="text-sm mute">No reminders yet.</p>`}${[...rem].sort((a,b)=>(a.d+(a.tm||'')).localeCompare(b.d+(b.tm||''))).map(r=>h`<div key=${r.id} class="flex items-center gap-2 py-1"><${CK} d=${r.done} on=${()=>upd(setRem,r.id,{done:!r.done})}/><span class="flex-1" style=${{textDecoration:r.done?'line-through':'none',opacity:r.done?.5:1}}>${r.t}</span><span class="text-xs mute">${dt(r.d)}${r.tm?' '+r.tm:''}</span><${Del} on=${()=>del(setRem,r.id)}/></div>`)}</div>
  <p class="text-xs mute mt-3">Due reminders show up at the top of the screen. Browser notifications only work while this page is open.</p><button class="chip mt-2" onClick=${()=>{try{Notification.requestPermission()}catch(e){}}}>Allow browser notifications</button></div>`}
  ${due.length>0&&h`<div class="card p-4 mb-4" style=${{border:'2px solid #E9A21B'}}><b class="flex items-center gap-2 mb-2">${Ic('bell',16)}Due now</b>${due.map(r=>h`<div key=${r.id} class="flex items-center gap-2 py-1"><${CK} d=${false} on=${()=>upd(setRem,r.id,{done:true})}/><span class="flex-1 font-semibold">${r.t}</span><span class="text-xs mute">${r.tm||dt(r.d)}</span></div>`)}</div>`}${open&&h`<div class="card p-4 mb-4"><p class="font-bold mb-3">Who is in the family?</p>${people.map(p=>h`<div key=${p.id} class="flex flex-wrap items-center gap-2 mb-3"><input type="color" aria-label="Custom color" value=${p.c} onInput=${e=>setP(p.id,{c:e.target.value})} style=${{width:40,height:36,border:0,background:'none',padding:0}}/><input class="inp" style=${{flex:'1 1 140px'}} value=${p.n} onInput=${e=>setP(p.id,{n:e.target.value})} aria-label="Name"/><div class="flex gap-1.5">${SW.map(c=>h`<button key=${c} aria-label=${c} onClick=${()=>setP(p.id,{c})} style=${{background:c,width:22,height:22,borderRadius:99,outline:p.c.toLowerCase()===c.toLowerCase()?'2px solid var(--ink)':'none',outlineOffset:2}}/>`)}</div></div>`)}<p class="text-xs mute">Changes apply everywhere right away: calendar, chores and legend.</p></div>`}
  <nav class="flex gap-2 mb-5 sticky z-10 py-2 scroll" style=${{top:'env(safe-area-inset-top,0px)',background:'var(--bg)'}}>${tabs.map(([id,ic,l,s])=>h`<button key=${id} onClick=${()=>setTab(id)} class="flex-none rounded-2xl px-4 py-3 flex flex-col sm:flex-row items-center justify-center gap-1 sm:gap-3 text-center" style=${tab===id?{background:'var(--brand)',color:'#fff'}:{background:'var(--card)',border:'1px solid var(--line)'}}>${Ic(ic,22)}<span class="leading-tight"><b class="block text-sm sm:text-base">${l}</b><span class="hidden sm:block text-xs opacity-75">${s}</span></span></button>`)}</nav>
  ${tab==='hub'&&h`<div class="grid lg:grid-cols-5 gap-5"><div class="lg:col-span-3"><${Cal}/></div><div class="lg:col-span-2 space-y-5"><${Grocery} g=${gro} setG=${setGro}/><${Chores}/></div></div>`}
  ${tab==='kids'&&h`<div class="max-w-3xl mx-auto"><${Birthdays}/></div>`}
  ${tab==='gift'&&h`<${Wishes}/>`}
  ${tab==='meal'&&h`<${Meals} gro=${gro} setGro=${setGro}/>`}${tab==='fin'&&h`<${Finance}/>`}${tab==='sos'&&h`<${Sos}/>`}${tab==='pack'&&h`<${Pack}/>`}</div>`;
}
function Boot(){
  const[st,setSt]=useState(sb?'load':'ready');const[em,setEm]=useState('');const[pw,setPw]=useState('');const[err,setErr]=useState('');
  const load=async()=>{
    const{data,error}=await sb.from('family_data').select('key,value');
    if(error){setErr(error.message);setSt('login');return}
    data.forEach(r=>{store[r.key]=r.value});
    sb.channel('fd').on('postgres_changes',{event:'*',schema:'public',table:'family_data'},p=>{const r=p.new;if(r&&r.key&&JSON.stringify(store[r.key])!==JSON.stringify(r.value)){store[r.key]=r.value;emit(r.key)}}).subscribe();
    setSt('ready')};
  useEffect(()=>{if(!sb)return;sb.auth.getSession().then(({data})=>data.session?load():setSt('login'))},[]);
  const login=async()=>{setErr('');const{error}=await sb.auth.signInWithPassword({email:em.trim(),password:pw});if(error)setErr('Anmeldung fehlgeschlagen: '+error.message);else{setSt('load');load()}};
  if(st==='ready')return h`<${App}/>`;
  if(st==='load')return h`<p class="p-8 mute">Lade Familiendaten...</p>`;
  return h`<div class="min-h-screen grid place-items-center p-4"><div class="card p-6 w-full" style=${{maxWidth:380}}><h1 class="text-3xl font-extrabold mb-1" style=${{color:'var(--brand)'}}>Zuhause</h1><p class="mute mb-4">Bitte anmelden (gleiches Login für die ganze Familie).</p><input class="inp mb-2" type="email" placeholder="E-Mail" value=${em} onInput=${e=>setEm(e.target.value)}/><input class="inp mb-3" type="password" placeholder="Passwort" value=${pw} onInput=${e=>setPw(e.target.value)} onKeyDown=${enter(login)}/>${err&&h`<p class="text-sm mb-3" style=${{color:'#E0566B'}}>${err}</p>`}<button class="btn w-full justify-center" onClick=${login}>Anmelden</button></div></div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(h`<${Boot}/>`);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
