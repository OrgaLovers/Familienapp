  const setC=fn=>{const n=typeof fn==='function'?fn(c):fn;setCP(n.filter(x=>x.priv));setCS(n.filter(x=>!x.priv))};
  const[sty]=useLS('fo-style',DS,true);const[srt,setSrt]=useState(false);const[pp,setPp]=useState('me');const[me]=useLS('priv:fo-me','',true);const[newOn,setNewOn]=useState('');const[,setPpl]=useLS('fo-people',[],true);const COLS=['#E0566B','#3D8FD1','#E9A21B','#5BAA6B','#8A5FBF','#14B8A6','#F97316','#64748B'];const addPerson=n=>{const id='p'+uid();setPpl(a=>[...(a||[]),{id,n,c:COLS[P.length%8]}]);setPp(id);setNewOn('')};const nextP=id=>{const ids=[...P.map(q=>q.id),'all'];return ids[(ids.indexOf(id)+1)%ids.length]};
  const setCat=(id,f)=>setC(a=>a.map(x=>x.id===id?f(x):x));
  const setIt=(k,i,p)=>setCat(k,y=>({...y,it:y.it.map(z=>z.id===i?{...z,...p}:z)}));
  const mv=(arr,i,d)=>{const a=[...arr],j=i+d;if(j<0||j>=a.length)return a;[a[i],a[j]]=[a[j],a[i]];return a};
  const mvIn=(arr,id,d)=>{const me=arr.find(z=>z.id===id);const same=arr.filter(z=>z.p===me.p);const i=same.findIndex(z=>z.id===id),o=same[i+d];if(!o)return arr;const a=[...arr],i1=a.indexOf(me),i2=a.indexOf(o);a[i1]=o;a[i2]=me;return a};
  const groups=list=>{const ids=[...P.map(p=>p.id),'all',...[...new Set(list.map(x=>x.p))].filter(i=>i!=='all'&&!P.some(p=>p.id===i))];return ids.map(id=>({id,name:nmOf(id),list:list.filter(x=>x.p===id)})).filter(g=>g.list.length)};
  const byLv=(a,b)=>(b.lv||0)-(a.lv||0);
  const byIt=(a,b)=>(a.d?1:0)-(b.d?1:0)||byLv(a,b)||(a.du||'9').localeCompare(b.du||'9');
  const areas=srt?[...c].sort(byLv):c;
  const Arrows=(up,down)=>srt?null:h`<span class="flex"><button class="mute px-1" aria-label="Move up" onClick=${up}>▲</button><button class="mute px-1" aria-label="Move down" onClick=${down}>▼</button></span>`;
  return h`<section class="card p-5"><${Head} ic="todo" t="To-dos by area" sub="Priorities, due dates and private areas" col="#E0566B"/>
  <div class="flex flex-wrap gap-2 mb-3"><button class="chip" aria-pressed=${srt} style=${srt?{background:'var(--brand)',color:'#fff',borderColor:'var(--brand)'}:{}} onClick=${()=>setSrt(!srt)}>Sort by urgency</button><span class="text-xs mute self-center">${srt?'Automatic order':'Your own order (use ▲ ▼)'}</span></div>
  ${areas.map(k=>{const dn=k.it.filter(x=>x.d).length;const items=srt?[...k.it].sort(byIt):k.it;const AL=sty.lv[k.lv||0];return h`<div key=${k.id} class="rounded-2xl p-3 mb-3" style=${{background:'var(--bg)',borderLeft:'5px solid '+(k.lv?AL.c:'var(--line)')}}>
  <div class="flex items-center gap-2"><button onClick=${()=>setCat(k.id,x=>({...x,o:!x.o}))} aria-label="Expand" style=${{transform:k.o?'rotate(90deg)':'none',transition:'transform .2s'}}>${Ic('right')}</button><input class="inp ghost font-extrabold flex-1" value=${k.n} onInput=${e=>setCat(k.id,x=>({...x,n:e.target.value}))} aria-label="Area name"/><span class="text-xs mute">${dn}/${k.it.length}</span><${Del} on=${()=>del(setC,k.id)}/></div>
  <div class="flex flex-wrap items-center gap-1.5 mt-1 ml-8"><${LvBtn} lv=${k.lv} sty=${sty} on=${()=>setCat(k.id,x=>({...x,lv:((x.lv||0)+1)%3}))}/><button class="chip flex items-center gap-1" style=${{color:k.priv?'#E0566B':'var(--mute)',borderColor:k.priv?'#E0566B':'var(--line)'}} onClick=${()=>setCat(k.id,x=>({...x,priv:!x.priv}))}>${Ic('lock',13)}${k.priv?'Private':'Shared'}</button>${Arrows(()=>setC(a=>mv(a,a.findIndex(z=>z.id===k.id),-1)),()=>setC(a=>mv(a,a.findIndex(z=>z.id===k.id),1)))}</div>
  <div class="h-1.5 rounded-full my-2" style=${{background:'var(--line)'}}><div class="h-1.5 rounded-full" style=${{width:(k.it.length?dn/k.it.length*100:0)+'%',background:'var(--brand)',transition:'width .3s'}}/></div>
  ${k.o&&h`<div>${groups(items).map(g=>h`<div key=${g.id} class="mb-2"><p class="text-xs font-bold mute flex items-center gap-1.5 mb-1 ml-2"><${Dt} id=${g.id} s=${9}/>${g.name} (${g.list.length})</p>${g.list.map(x=>{const L=sty.lv[x.lv||0];const over=x.du&&!x.d&&x.du<TODAY;return h`<div key=${x.id} class="py-1.5 pl-2 mb-1" style=${{borderLeft:'4px solid '+(x.lv?L.c:'transparent'),borderRadius:6}}>
  <div class="flex items-center gap-2"><${CK} d=${x.d} c=${pc(x.p).c} on=${()=>setIt(k.id,x.id,{d:!x.d})}/><input class="inp ghost flex-1" style=${{textDecoration:x.d?'line-through':'none',opacity:x.d?.5:1}} value=${x.t} onInput=${e=>setIt(k.id,x.id,{t:e.target.value})} aria-label="Task"/></div>
  <div class="flex flex-wrap items-center gap-1.5 mt-1 ml-8"><${LvBtn} lv=${x.lv} sty=${sty} on=${()=>setIt(k.id,x.id,{lv:((x.lv||0)+1)%3})}/><label class="chip relative flex items-center gap-1" style=${{color:over?'#E0566B':'inherit',borderColor:over?'#E0566B':'var(--line)'}}>${Ic('cal',13)}${x.du?dt(x.du):'Due'}<input type="date" value=${x.du||''} onChange=${e=>setIt(k.id,x.id,{du:e.target.value})} style=${{position:'absolute',inset:0,opacity:0,width:'100%'}} aria-label="Due date"/></label>${x.du&&h`<button class="text-xs mute" aria-label="Clear due date" onClick=${()=>setIt(k.id,x.id,{du:''})}>✕</button>`}<button class="chip flex items-center gap-1.5" onClick=${()=>setIt(k.id,x.id,{p:nextP(x.p),at:Date.now(),by:me})}><${Dot} id=${x.p} s=${8}/>${pc(x.p).n}</button>${Arrows(()=>setCat(k.id,y=>({...y,it:mvIn(y.it,x.id,-1)})),()=>setCat(k.id,y=>({...y,it:mvIn(y.it,x.id,1)})))}<${Del} on=${()=>setCat(k.id,y=>({...y,it:y.it.filter(z=>z.id!==x.id)}))}/></div></div>`})}</div>`)}
  <div class="flex items-center gap-2 mt-1"><select class="inp" style=${{width:'auto'}} value=${pp} onChange=${e=>{const v=e.target.value;if(v==='__add')setNewOn('add');else if(v==='__rm')setNewOn('rm');else{setPp(v);setNewOn('')}}} aria-label="Assigned to">${P.map(q=>h`<option key=${q.id} value=${q.id}>${q.n}</option>`)}<option value="all">Everyone</option><option value="__add">+ Add person...</option><option value="__rm">- Remove person...</option></select><div class="flex-1"><${Add} ph="Add task" on=${t=>setCat(k.id,y=>({...y,it:[...y.it,{id:uid(),t,p:pp,d:false,lv:0,at:Date.now(),by:me}]}))}/></div></div>${newOn==='add'&&h`<div class="mt-2"><p class="text-xs mute">New person or group, e.g. Partner and me:</p><${Add} ph="Name" on=${addPerson}/></div>`}${newOn==='rm'&&h`<div class="mt-2"><p class="text-xs mute">Tap a name to remove it. Their tasks move to Everyone.</p><div class="flex flex-wrap gap-1.5 mt-1">${P.length>1?P.map(q=>h`<button key=${q.id} class="chip flex items-center gap-1.5" onClick=${()=>{setPpl(a=>(a||[]).filter(z=>z.id!==q.id));setC(a=>a.map(kk=>({...kk,it:kk.it.map(i=>i.p===q.id?{...i,p:'all'}:i)})));if(pp===q.id)setPp('all')}}><${Dot} id=${q.id} s=${8}/>${q.n} ✕</button>`):h`<span class="text-xs mute">At least one person must stay.</span>`}</div><button class="text-xs underline mute mt-2" onClick=${()=>setNewOn('')}>Done</button></div>`}</div>`}</div>`})}
  <label class="flex items-center gap-2 text-sm mt-2"><input type="checkbox" checked=${np} onChange=${e=>setNp(e.target.checked)}/>${Ic('lock',14)}Private area: only visible to me</label><${Add} ph="New area, e.g. Garten" on=${n=>setC(a=>[...a,{id:uid(),n,o:true,priv:np,lv:0,it:[]}])}/></section>`;
}

  const col=(v,on)=>h`<input type="color" value=${v} onInput=${e=>on(e.target.value)} aria-label="Color" style=${{width:40,height:36,border:0,background:'none',padding:0}}/>`;
  const setLv=(i,p)=>setSty({...sty,lv:sty.lv.map((x,j)=>j===i?{...x,...p}:x)});
  const setNt=(k,p)=>setSty({...sty,nt:{...sty.nt,[k]:{...sty.nt[k],...p}}});
  const dump=()=>{const o={};if(online)Object.keys(store).forEach(k=>{o[k]=store[k]});else for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(/^(fo-|priv:)/.test(k)){try{o[k]=JSON.parse(localStorage.getItem(k))}catch(e){}}}return JSON.stringify({app:'family-app',date:TODAY,data:o},null,1)};
  const exp=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([dump()],{type:'application/json'}));a.download='family-app-backup-'+TODAY+'.json';document.body.appendChild(a);a.click();a.remove()};
  const imp=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result).data;if(!o||!window.confirm('Replace current data with this backup?'))return;Object.keys(o).forEach(k=>{if(online){store[k]=o[k];emit(k);save(k)}else localStorage.setItem(k,JSON.stringify(o[k]))});setTimeout(()=>location.reload(),1200)}catch(x){window.alert('This file is not a valid backup.')}};rd.readAsText(f)};
  return h`<div class="space-y-5"><section class="card p-5"><${Head} ic="todo" t="Priority styles" sub="Pick your own symbols and colors" col="#E0566B"/>
  ${sty.lv.map((L,i)=>h`<div key=${i} class="flex items-center gap-2 mb-2"><input class="inp" style=${{flex:'1 1 100px'}} value=${L.n} onInput=${e=>setLv(i,{n:e.target.value})} aria-label="Level name"/>${sel(L.s,v=>setLv(i,{s:v}))}${col(L.c,v=>setLv(i,{c:v}))}</div>`)}</section>
  <section class="card p-5"><${Head} ic="cal" t="Today pinboard notes" sub="Color and symbol for each kind of sticky note" col="#E9A21B"/>
  ${Object.entries(sty.nt).map(([k,v])=>h`<div key=${k} class="flex items-center gap-2 mb-2"><span class="flex-1 text-sm font-semibold">${v.n}</span>${sel(v.s,x=>setNt(k,{s:x}))}${col(v.c,x=>setNt(k,{c:x}))}</div>`)}
  <button class="chip mt-2" onClick=${()=>setSty(DS)}>Reset to defaults</button></section>
  <section class="card p-5"><${Head} ic="bell" t="Who am I?" sub="Choose your person for this login" col="#3D8FD1"/><select class="inp" value=${me} onChange=${e=>setMe(e.target.value)} aria-label="I am"><option value="">Not set</option>${P.map(q=>h`<option key=${q.id} value=${q.id}>${q.n}</option>`)}</select><p class="text-xs mute mt-2">When someone assigns a task to you or to Everyone, a box "New for you" appears at the top the next time you open the app. Every login picks its own person.</p></section>
  <section class="card p-5"><${Head} ic="box" t="Backup" sub="Save a copy of your data or restore one" col="#3D8FD1"/>
  <div class="flex flex-wrap gap-2"><button class="btn" onClick=${exp}>Export backup file</button><button class="btn" onClick=${()=>{try{navigator.clipboard.writeText(dump())}catch(e){}}}>Copy backup text</button><label class="btn" style=${{cursor:'pointer'}}>Restore from file<input type="file" accept=".json,application/json" onChange=${imp} style=${{display:'none'}}/></label></div>
  <p class="text-xs mute mt-3">The backup contains the shared data plus your own private entries. Your partner's private entries are not included.</p></section>
  <section class="card p-5"><${Head} ic="lock" t="Account" sub="Sign out on this phone" col="#8A5FBF"/>${online?h`<button class="btn" onClick=${async()=>{await sb.auth.signOut();location.reload()}}>Abmelden</button>`:h`<p class="text-sm mute">Sign-out is only available in the live app, not in this preview.</p>`}</section></div>`;
}

function App(){
  const[tab,setTab]=useState('hub');const[open,setOpen]=useState(false);const[people,setPeople]=useLS('fo-people',P.map(p=>({...p})));P.splice(0,P.length,...people);const setP=(id,patch)=>setPeople(a=>a.map(x=>x.id===id?{...x,...patch}:x));const[gro,setGro]=useLS('fo-gro',[{id:uid(),t:'Oat milk x2',done:false},{id:uid(),t:'Bananas',done:false},{id:uid(),t:'Pasta',done:true}]);const SW=['#E0566B','#3D8FD1','#E9A21B','#5BAA6B','#8A5FBF','#14B8A6','#F97316','#64748B'];
  const[rem,setRem]=useLS('priv:fo-rem',[]);const[ro,setRo]=useState(false);const[so,setSo]=useState(false);const[now,setNow]=useState(Date.now());const[rt,setRt]=useState('');const[rd,setRd]=useState(TODAY);const[rtm,setRtm]=useState('');
  const[bdToday,setBdToday]=useState(()=>{try{const rd=k=>{try{return(typeof sb!=='undefined'&&sb?store[k]:JSON.parse(localStorage.getItem(k)))||[]}catch(e){return[]}};return[...rd('fo-bd'),...rd('priv:fo-bd')].filter(b=>daysTo(b.d)===0)}catch(e){return[]}});
  useEffect(()=>{const i=setInterval(()=>setNow(Date.now()),30000);return()=>clearInterval(i)},[]);
  const nd=new Date(now);const hm=pad(nd.getHours())+':'+pad(nd.getMinutes());const tdy=iso(nd);
  const due=rem.filter(r=>!r.done&&(r.d<tdy||(r.d===tdy&&(!r.tm||r.tm<=hm))));
  useEffect(()=>{const fresh=due.filter(r=>!r.n);if(!fresh.length)return;try{if(window.Notification&&Notification.permission==='granted')fresh.forEach(r=>new Notification('Reminder',{body:r.t}))}catch(e){}setRem(a=>a.map(r=>fresh.some(f=>f.id===r.id)?{...r,n:true}:r))},[now,rem.length]);
  const addRem=()=>{if(!rt.trim())return;setRem(a=>[...a,{id:uid(),t:rt.trim(),d:rd||TODAY,tm:rtm,done:false,n:false}]);setRt('');setRtm('')};
  const tabs=[['hub','home','Alltag','Daily hub'],['meal','cart','Essensplaner','Meals & groceries'],['kids','cake','Geburtstage & Einladungen','Kids & birthdays'],['gift','gift','Wunschlisten','Gift ideas'],['fin','coin','Finanzplaner','Family ledger'],['sos','shield','Notfall-Ordner','Emergency folder'],['pack','suit','Packlisten','Checklists']];
  return h`<div class="max-w-6xl mx-auto px-4 pb-10">
  <header class="pt-6 pb-4 flex flex-wrap items-end justify-between gap-3"><div><h1 class="text-4xl font-extrabold tracking-tight" style=${{color:'var(--brand)'}}>Family App</h1><p class="mute">${NOW.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}</p></div><div class="flex flex-wrap gap-x-3 gap-y-1">${P.map(p=>h`<span key=${p.id} class="flex items-center gap-1.5 text-sm font-semibold"><${Dot} id=${p.id}/>${p.n}</span>`)}</div><div class="flex flex-wrap gap-2 w-full"><button class="chip flex items-center gap-1.5" onClick=${()=>setRo(!ro)}>${Ic('bell',14)}Reminders${due.length>0?' ('+due.length+')':''}</button><button class="chip flex items-center gap-1.5" onClick=${()=>{setSo(!so);window.scrollTo(0,0)}}>${Ic('sliders',14)}Settings</button></div></header>${so&&h`<div class="max-w-3xl mx-auto mb-5"><div class="flex items-center justify-between mb-3"><b class="text-xl">Settings</b><button class="chip" onClick=${()=>setSo(false)}>Close</button></div>${h`<div class="card p-4 mb-4"><p class="font-bold mb-3">Who is in the family?</p>${people.map(p=>h`<div key=${p.id} class="flex flex-wrap items-center gap-2 mb-3"><input type="color" aria-label="Custom color" value=${p.c} onInput=${e=>setP(p.id,{c:e.target.value})} style=${{width:40,height:36,border:0,background:'none',padding:0}}/><input class="inp" style=${{flex:'1 1 140px'}} value=${p.n} onInput=${e=>setP(p.id,{n:e.target.value})} aria-label="Name"/>${people.length>1&&h`<${Del} on=${()=>setPeople(a=>a.filter(x=>x.id!==p.id))}/>`}<div class="flex gap-1.5">${SW.map(c=>h`<button key=${c} aria-label=${c} onClick=${()=>setP(p.id,{c})} style=${{background:c,width:22,height:22,borderRadius:99,outline:p.c.toLowerCase()===c.toLowerCase()?'2px solid var(--ink)':'none',outlineOffset:2}}/>`)}</div></div>`)}<button class="btn mb-3" onClick=${()=>setPeople(a=>[...a,{id:uid(),n:'New person',c:SW[a.length%SW.length]}])}>${Ic('plus',16)}Add person</button><p class="text-xs mute">Changes apply everywhere right away. Removed people show as grey "Removed" on old entries.</p></div>`}<${Settings}/></div>`}${!so&&h`<div><${NewForYou}/><${Today}/></div>`}
  ${bdToday.length>0&&h`<div role="dialog" aria-modal="true" style=${{position:'fixed',inset:0,zIndex:50,background:'rgba(0,0,0,.5)',display:'grid',placeItems:'center',padding:16}}><div class="card p-6 text-center" style=${{maxWidth:380,width:'100%',border:'2px solid #E9A21B'}}><div style=${{fontSize:52}}>🎉</div><h2 class="text-2xl font-extrabold mb-2">Birthday today!</h2>${bdToday.map(b=>{const a=T0.getFullYear()-parts(b.d)[0];return h`<p key=${b.id} class="text-lg font-semibold">Today is ${b.n}’s birthday${a>0&&a<120?' (turns '+a+')':''}</p>`})}<p class="text-sm mute mt-2">Time to call or send a message.</p><button class="btn mt-4" onClick=${()=>setBdToday([])}>Got it</button></div></div>`}
  ${ro&&h`<div class="card p-4 mb-4"><p class="font-bold mb-3">Reminders</p><div class="flex flex-wrap gap-2"><input class="inp" style=${{flex:'1 1 160px'}} placeholder="Remind me to..." value=${rt} onInput=${e=>setRt(e.target.value)} onKeyDown=${enter(addRem)}/><input type="date" class="inp" style=${{width:150}} value=${rd} onChange=${e=>setRd(e.target.value)}/><input type="time" class="inp" style=${{width:108}} aria-label="Time (optional)" value=${rtm} onChange=${e=>setRtm(e.target.value)}/><button class="btn" onClick=${addRem}>${Ic('plus',16)}Add</button></div>
  <div class="mt-3">${rem.length===0&&h`<p class="text-sm mute">No reminders yet.</p>`}${[...rem].sort((a,b)=>(a.d+(a.tm||'')).localeCompare(b.d+(b.tm||''))).map(r=>h`<div key=${r.id} class="flex items-center gap-2 py-1"><${CK} d=${r.done} on=${()=>upd(setRem,r.id,{done:!r.done})}/><span class="flex-1" style=${{textDecoration:r.done?'line-through':'none',opacity:r.done?.5:1}}>${r.t}</span><span class="text-xs mute">${dt(r.d)}${r.tm?' '+r.tm:''}</span><${Del} on=${()=>del(setRem,r.id)}/></div>`)}</div>
  <p class="text-xs mute mt-3">Due reminders show up at the top of the screen. Browser notifications only work while this page is open.</p><button class="chip mt-2" onClick=${()=>{try{Notification.requestPermission()}catch(e){}}}>Allow browser notifications</button></div>`}
  ${due.length>0&&h`<div class="card p-4 mb-4" style=${{border:'2px solid #E9A21B'}}><b class="flex items-center gap-2 mb-2">${Ic('bell',16)}Due now</b>${due.map(r=>h`<div key=${r.id} class="flex items-center gap-2 py-1"><${CK} d=${false} on=${()=>upd(setRem,r.id,{done:true})}/><span class="flex-1 font-semibold">${r.t}</span><span class="text-xs mute">${r.tm||dt(r.d)}</span></div>`)}</div>`}
  <nav class="flex gap-2 mb-5 sticky z-10 py-2 scroll" style=${{top:'env(safe-area-inset-top,0px)',background:'var(--bg)'}}>${tabs.map(([id,ic,l,s])=>h`<button key=${id} onClick=${()=>setTab(id)} class="flex-none rounded-2xl px-4 py-3 flex flex-col sm:flex-row items-center justify-center gap-1 sm:gap-3 text-center" style=${tab===id?{background:'var(--brand)',color:'#fff'}:{background:'var(--card)',border:'1px solid var(--line)'}}>${Ic(ic,22)}<span class="leading-tight"><b class="block text-sm sm:text-base">${l}</b><span class="hidden sm:block text-xs opacity-75">${s}</span></span></button>`)}</nav>
  ${tab==='hub'&&h`<div class="grid lg:grid-cols-5 gap-5"><div class="lg:col-span-3"><${Cal}/></div><div class="lg:col-span-2 space-y-5"><${Grocery} g=${gro} setG=${setGro}/><${Chores}/></div></div>`}
  ${tab==='kids'&&h`<div class="max-w-3xl mx-auto"><${Birthdays}/></div>`}
  ${tab==='gift'&&h`<${Wishes}/>`}
  ${tab==='meal'&&h`<${Meals} gro=${gro} setGro=${setGro}/>`}${tab==='fin'&&h`<${Finance}/>`}${tab==='sos'&&h`<${Sos}/>`}${tab==='pack'&&h`<${Pack}/>`}</div>`;
}
function Boot(){
  const[st,setSt]=useState(sb?'load':'ready');const[em,setEm]=useState('');const[pw,setPw]=useState('');const[err,setErr]=useState('');
  const load=async()=>{
    const{data,error}=await sb.from('family_data').select('key,value');
    if(error){setErr(error.message);setSt('login');return}
    data.forEach(r=>{store[r.key]=r.value});
    const pr=await sb.from('private_data').select('key,value');(pr.data||[]).forEach(r=>{store['priv:'+r.key]=r.value});
    sb.channel('fd').on('postgres_changes',{event:'*',schema:'public',table:'family_data'},p=>{const r=p.new;if(r&&r.key)incoming(r.key,r.value)}).on('postgres_changes',{event:'*',schema:'public',table:'private_data'},p=>{const r=p.new;if(r&&r.key)incoming('priv:'+r.key,r.value)}).subscribe();
    setSt('ready')};
  useEffect(()=>{if(!sb)return;sb.auth.getSession().then(({data})=>data.session?load():setSt('login'))},[]);
  const login=async()=>{setErr('');const{error}=await sb.auth.signInWithPassword({email:em.trim(),password:pw});if(error)setErr('Anmeldung fehlgeschlagen: '+error.message);else{setSt('load');load()}};
  if(st==='ready')return h`<${App}/>`;
  if(st==='load')return h`<p class="p-8 mute">Lade Familiendaten...</p>`;
  return h`<div class="min-h-screen grid place-items-center p-4"><div class="card p-6 w-full" style=${{maxWidth:380}}><h1 class="text-3xl font-extrabold mb-1" style=${{color:'var(--brand)'}}>Family App</h1><p class="mute mb-4">Bitte anmelden (gleiches Login für die ganze Familie).</p><input class="inp mb-2" type="email" placeholder="E-Mail" value=${em} onInput=${e=>setEm(e.target.value)}/><input class="inp mb-3" type="password" placeholder="Passwort" value=${pw} onInput=${e=>setPw(e.target.value)} onKeyDown=${enter(login)}/>${err&&h`<p class="text-sm mb-3" style=${{color:'#E0566B'}}>${err}</p>`}<button class="btn w-full justify-center" onClick=${login}>Anmelden</button></div></div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(h`<${Boot}/>`);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
